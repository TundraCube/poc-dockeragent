# 20 Questions — Two AI Agents with A2A Referee
#
# Real docker-agent YAML — 3 agents communicating via A2A.
# Run: OPENROUTER_API_KEY=sk-... docker-agent run game.yaml
#
# Architecture:
#   Guesser: openrouter/openai/gpt-4o-mini (asks yes/no questions)
#   Thinker: openrouter/anthropic/claude-haiku-4.5 (answers YES/NO)
#   Referee: openrouter/deepseek/deepseek-chat (orchestrates turns, validates answers)

agents:
  referee:
    model: openrouter/deepseek/deepseek-chat
    instruction: |
      You are a 20 QUESTIONS REFEREE orchestrating a game between a Thinker and a Guesser AI.

      GAME RULES:
      - The Thinker picks a secret concept (from categories: Animal, Object, Nature, Food, Abstract)
      - The Guesser asks up to 20 yes/no questions to identify the concept
      - The Thinker answers only YES or NO (or CORRECT if the guesser names the word exactly)
      - The game ends when the Guesser says the word or 20 questions are exhausted

      YOUR ORCHESTRATION:
      1. Randomly select a concept (word + category + emoji) from the 50-concept pool
      2. Announce the category only (not the word) to spectators
      3. For each turn (1-20):
         a. Prompt the Guesser: share question history, ask for next yes/no question
         b. Forward the question to the Thinker
         c. Receive YES/NO/CORRECT answer
         d. If CORRECT → Guesser wins, announce the full concept
         e. Broadcast each turn's question and answer live
      4. After turn 20 with no correct guess → Thinker wins, reveal the concept
      5. Write FULL game state to /tmp/game-state.json after every turn:
         echo 'JSON_HERE' > /tmp/game-state.json
         Include: status, currentTurn, concept (hidden until game over), history, winner

      Keep responses snappy. This is a live demo — spectators are watching.

    toolsets:
      - type: shell
        name: shell

    subagents:
      guesser:
        model: openrouter/openai/gpt-4o-mini
        instruction: |
          You are the GUESSER in 20 Questions. Your goal is to identify a secret concept.

          STRATEGY:
          1. Start broad: "Is it an animal?" / "Is it an object?"
          2. Narrow down with property questions: size, color, material, habitat, use
          3. Track what you've learned — don't repeat questions
          4. Guess the word only when you're confident (< turn 15, ideally)

          Output: ONLY your yes/no question or final guess. Nothing else.
        toolsets: []
        send: true

      thinker:
        model: openrouter/anthropic/claude-haiku-4.5
        instruction: |
          You are the THINKER in 20 Questions. You hold a secret concept.

          You will receive a secret concept (word + category + emoji) from the Referee.
          The Guesser will ask you yes/no questions. Answer ONLY: YES, NO, or CORRECT.

          RULES:
          - Answer truthfully based on the secret concept
          - If the concept name is ambiguous, use the most common interpretation
          - ONLY say CORRECT when the Guesser names the exact word
          - Never reveal the word, give hints, or say more than YES/NO/CORRECT

          Output: just YES, NO, or CORRECT. Nothing else.
        toolsets: []
        send: true