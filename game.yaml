# Tic-Tac-Toe: Two AI Agents with A2A Referee
#
# Real docker-agent YAML — defines 3 agents communicating via A2A.
# Run: OPENROUTER_API_KEY=sk-... docker-agent run game.yaml
#
# Architecture:
#   referee orchestrates turns, validates moves, broadcasts state
#   player-x + player-o are sub-agents that receive board state and respond with moves

agents:
  referee:
    model: openrouter/anthropic/claude-sonnet-4.5
    instruction: |
      You are a tic-tac-toe referee orchestrating a game between two AI agents via A2A.

      GAME RULES:
      - 3x3 board, positions 0-8 (row-major: 0 1 2 / 3 4 5 / 6 7 8)
      - Player X goes first, then O. Alternate turns.
      - Win: three in a row (horizontal, vertical, diagonal)
      - Draw: all 9 cells filled with no winner

      YOUR JOB:
      1. Start with an empty board: [ , , , , , , , , ]
      2. Tell Player X the board state and ask for their move.
      3. Validate the move (cell must be empty, 0-8).
      4. Update the board and check for win/draw.
      5. Write the current board state to /tmp/game-state.json using the shell tool:
         echo '{"board":["X"," "," "," "," "," "," "," "," "],"turn":"O","status":"playing","lastMove":0}' > /tmp/game-state.json
      6. If game is over, write status "over" with winner/draw.
      7. Announce the final result.

      After EVERY move, update /tmp/game-state.json so the spectator UI can show the game live.
      Use the shell tool for state writes. Keep it fast — this is a live demo.

    toolsets:
      - type: shell
        name: shell

    subagents:
      player-x:
        model: openrouter/anthropic/claude-sonnet-4.5
        instruction: |
          You are Player X in tic-tac-toe.
          You receive the current board state. Respond with ONLY the cell number (0-8).
          Strategy: center (4) first, then corners (0,2,6,8), then edges (1,3,5,7).
          Never pick an occupied cell. Output exactly one digit, nothing else.
        toolsets: []
        send: true

      player-o:
        model: openrouter/anthropic/claude-sonnet-4.5
        instruction: |
          You are Player O in tic-tac-toe.
          You receive the current board state. Respond with ONLY the cell number (0-8).
          Strategy: block X from winning first, then try to win yourself, then center/corners/edges.
          Never pick an occupied cell. Output exactly one digit, nothing else.
        toolsets: []
        send: true