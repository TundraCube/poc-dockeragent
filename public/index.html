<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>20 Questions — Agent Arena</title>
<style>
:root{
  --bg:#0b0e1a; --panel:#141829; --line:#262c47; --text:#e8ebff; --dim:#8a91b5;
  --think:#ff5d6c; --guess:#4da3ff; --ref:#ffc94d; --yes:#3ddc97; --no:#ff5d6c;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:radial-gradient(1200px 600px at 50% -10%,#1b2146 0,var(--bg) 60%) fixed;color:var(--text);
  font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100vh;overflow-x:hidden}
button,select{font:inherit}
.wrap{max-width:1100px;margin:0 auto;padding:18px 16px 40px}

header{text-align:center;margin-bottom:14px}
h1{font-size:30px;letter-spacing:1px;background:linear-gradient(90deg,var(--think),var(--ref),var(--guess));
  -webkit-background-clip:text;background-clip:text;color:transparent}
.sub{color:var(--dim);font-size:13px;margin-top:2px}
.controls{display:flex;gap:10px;justify-content:center;align-items:end;flex-wrap:wrap;margin-top:14px}
.controls label{display:flex;flex-direction:column;font-size:11px;text-transform:uppercase;letter-spacing:1px;color:var(--dim);gap:4px;text-align:left}
select{background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-width:180px}
select:disabled{opacity:.5}
.btn{border:0;border-radius:10px;padding:10px 22px;font-weight:700;cursor:pointer;color:#fff;transition:transform .1s,filter .2s}
.btn:hover{filter:brightness(1.15)} .btn:active{transform:scale(.96)}
.btn.go{background:linear-gradient(135deg,var(--yes),#1fb4a0)}
.btn.stop{background:linear-gradient(135deg,var(--no),#c8325a)}
.hidden{display:none!important}

.secret{margin:16px auto 10px;max-width:520px;text-align:center;padding:10px 16px;border:1px dashed var(--ref);border-radius:14px;
  background:rgba(255,201,77,.06);transition:opacity .3s}
.secret small{color:var(--dim);text-transform:uppercase;letter-spacing:2px;font-size:10px;display:block}
.secret b{font-size:24px;color:var(--ref)}
.secret.empty{opacity:.35}

.pips{display:flex;gap:5px;justify-content:center;margin:8px 0 14px;flex-wrap:wrap}
.pip{width:26px;height:26px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;font-size:11px;color:var(--dim);transition:all .3s}
.pip.now{border-color:var(--ref);color:var(--ref);box-shadow:0 0 10px var(--ref);animation:pulse 1.2s infinite}
.pip.yes{background:var(--yes);border-color:var(--yes);color:#06251a}
.pip.no{background:var(--no);border-color:var(--no);color:#2b0610}
.pip.win{background:var(--ref);border-color:var(--ref);color:#2b2006}

.arena{display:grid;grid-template-columns:170px 1fr 170px;gap:12px;align-items:start}
.side{position:sticky;top:12px;text-align:center}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:30px 8px 12px;transition:all .3s;overflow:hidden}
.side.active .card{box-shadow:0 0 24px -2px var(--c);border-color:var(--c)}
.side.thinker{--c:var(--think)} .side.guesser{--c:var(--guess)}
.role{font-weight:800;letter-spacing:2px;font-size:12px;color:var(--c);margin-top:6px}
.model{font-size:11px;color:var(--dim);margin-top:2px;min-height:15px}
.status{font-size:12px;margin-top:6px;color:var(--dim);min-height:17px}
.side.active .status{color:var(--c)}

.bot{position:relative;width:110px;height:130px;margin:0 auto;animation:bob 3s ease-in-out infinite}
.bot .ant{position:absolute;top:0;left:50%;width:4px;height:16px;background:#9aa;transform:translateX(-50%)}
.bot .ant::after{content:"";position:absolute;top:-8px;left:-5px;width:14px;height:14px;border-radius:50%;background:var(--c);box-shadow:0 0 12px var(--c);animation:blink 2s infinite}
.bot .head{position:absolute;top:16px;left:50%;transform:translateX(-50%);width:92px;height:70px;background:linear-gradient(160deg,#3a4066,#242846);
  border:3px solid var(--c);border-radius:14px;overflow:hidden}
.guesser .head{border-radius:50% 50% 40% 40%}
.eyes{position:absolute;top:18px;left:0;right:0;display:flex;justify-content:center;gap:18px}
.eye{width:16px;height:16px;border-radius:50%;background:var(--c);box-shadow:0 0 8px var(--c);animation:eyeblink 4s infinite;position:relative}
.guesser .eye:first-child{width:22px;height:22px;margin-top:-3px}
.mouth{position:absolute;bottom:10px;left:50%;width:30px;height:6px;margin-left:-15px;border-radius:6px;background:var(--c);transition:all .15s}
.talking .mouth{animation:talk .25s infinite alternate}
.bot .body{position:absolute;top:90px;left:50%;transform:translateX(-50%);width:70px;height:40px;background:linear-gradient(160deg,#343a5e,#1e2240);border:3px solid var(--c);border-radius:10px 10px 18px 18px}
.bot .body::after{content:"";position:absolute;left:50%;top:9px;width:16px;height:16px;margin-left:-8px;font-size:15px;line-height:16px}
.thinker .body::after{content:"🧠"} .guesser .body::after{content:"🔍"}
.dots{position:absolute;top:-6px;right:-4px;font-size:18px;opacity:0}
.thinking .dots{opacity:1;animation:bob .8s infinite}
.thinking .eye{animation:scan 1s infinite alternate}
.nod{animation:nod .5s 2!important} .shake{animation:shake .5s 2!important}
.win .bot{animation:jump .6s infinite} .lose .bot{filter:grayscale(.7);transform:rotate(-6deg);animation:none}

.chat{background:rgba(20,24,41,.7);border:1px solid var(--line);border-radius:18px;min-height:460px;max-height:62vh;overflow-y:auto;padding:16px 12px;display:flex;flex-direction:column;gap:10px;scroll-behavior:smooth}
.chat{scrollbar-width:thin;scrollbar-color:#2c335a transparent}
.chat::-webkit-scrollbar{width:8px}
.chat::-webkit-scrollbar-track{background:transparent;margin:10px 0}
.chat::-webkit-scrollbar-thumb{background:#2c335a;border-radius:99px;border:2px solid transparent;background-clip:padding-box}
.chat::-webkit-scrollbar-thumb:hover{background:#3d4678;background-clip:padding-box;border:2px solid transparent}
.empty-hint{margin:auto;color:var(--dim);text-align:center}
.msg{max-width:78%;padding:9px 14px;border-radius:16px;position:relative;animation:pop .35s cubic-bezier(.2,1.6,.4,1);box-shadow:0 4px 14px rgba(0,0,0,.35)}
.msg small{display:block;font-size:10px;letter-spacing:1.5px;text-transform:uppercase;opacity:.8;margin-bottom:2px}
.msg.q{align-self:flex-end;background:linear-gradient(135deg,#2f7fdc,#4da3ff);border-bottom-right-radius:4px;color:#04142b}
.msg.a{align-self:flex-start;background:linear-gradient(135deg,#d6414f,#ff7a5d);border-bottom-left-radius:4px;color:#2b0509}
.msg.a.yes{background:linear-gradient(135deg,#1fa874,#3ddc97);color:#032014}
.msg.a .ans{font-size:20px;font-weight:900;letter-spacing:2px}
.msg .why{font-size:12px;opacity:.85;margin-top:4px;font-style:italic;line-height:1.35}
.msg.a.correct{background:linear-gradient(135deg,#e9a800,#ffe066);color:#2b2006}
.msg.typing{opacity:.85}
.typing span{display:inline-block;width:7px;height:7px;margin:0 2px;border-radius:50%;background:currentColor;animation:bounce 1s infinite}
.typing span:nth-child(2){animation-delay:.15s}.typing span:nth-child(3){animation-delay:.3s}

.flow{display:flex;align-items:center;justify-content:center;margin:0 auto 12px;max-width:640px}
.node{padding:6px 12px;border-radius:99px;border:1px solid var(--line);background:var(--panel);font-size:12px;white-space:nowrap;transition:all .3s}
.node.on{color:#000;font-weight:700}
.node.t.on{background:var(--think);box-shadow:0 0 16px var(--think)}
.node.r.on{background:var(--ref);box-shadow:0 0 16px var(--ref)}
.node.g.on{background:var(--guess);box-shadow:0 0 16px var(--guess)}
.wire{flex:1;height:2px;background:var(--line);position:relative;min-width:30px;overflow:hidden}
.wire i{position:absolute;top:-3px;width:8px;height:8px;border-radius:50%;background:var(--ref);box-shadow:0 0 10px var(--ref);opacity:0}
.wire.l i{animation:packetL .9s linear infinite;opacity:1}
.wire.r i{animation:packetR .9s linear infinite;opacity:1}

.overlay{position:fixed;inset:0;display:grid;place-items:center;pointer-events:none;z-index:50}
.pop{background:rgba(15,18,35,.95);border:2px solid var(--ref);border-radius:24px;padding:26px 44px;text-align:center;box-shadow:0 0 60px rgba(255,201,77,.35);animation:reveal 3s ease forwards}
.pop .e{font-size:76px}.pop .t{color:var(--dim);letter-spacing:3px;font-size:12px;text-transform:uppercase}.pop .w{font-size:34px;font-weight:900;color:var(--ref)}
.banner{margin:14px auto 0;max-width:560px;text-align:center;padding:16px;border-radius:16px;border:2px solid var(--c);background:var(--panel);animation:pop .5s}
.banner h2{font-size:24px;color:var(--c)}
.banner p{color:var(--dim);margin:4px 0 12px}
.confetti{position:fixed;top:-20px;width:10px;height:14px;pointer-events:none;z-index:60;animation:fall linear forwards}

@keyframes bob{50%{transform:translateY(-5px)}}
@keyframes blink{50%{opacity:.3}}
@keyframes eyeblink{0%,94%,100%{transform:scaleY(1)}97%{transform:scaleY(.1)}}
@keyframes scan{from{transform:translateX(-3px)}to{transform:translateX(3px)}}
@keyframes talk{from{height:4px}to{height:14px;border-radius:10px}}
@keyframes nod{50%{transform:translateY(8px)}}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
@keyframes jump{50%{transform:translateY(-14px)}}
@keyframes pop{from{transform:scale(.6);opacity:0}}
@keyframes bounce{50%{transform:translateY(-5px)}}
@keyframes pulse{50%{box-shadow:0 0 2px var(--ref)}}
@keyframes reveal{0%{transform:scale(.3) rotate(-8deg);opacity:0}12%{transform:scale(1.08);opacity:1}20%{transform:scale(1)}85%{opacity:1}100%{opacity:0;transform:scale(1.1)}}
@keyframes packetR{from{left:-8px}to{left:100%}}
@keyframes packetL{from{left:100%}to{left:-8px}}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
@media(max-width:760px){.arena{grid-template-columns:1fr}.side{position:static}.chat{max-height:50vh}}

/* ── How-it-works drawer ── */
.info-btn{position:fixed;top:14px;right:14px;z-index:40;background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:99px;padding:8px 14px;cursor:pointer;font-size:13px;transition:all .2s}
.info-btn:hover{border-color:var(--ref);color:var(--ref)}
.backdrop{position:fixed;inset:0;background:rgba(5,7,15,.55);opacity:0;pointer-events:none;transition:opacity .3s;z-index:70}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(500px,94vw);background:#0f1322;border-left:1px solid var(--line);z-index:80;transform:translateX(100%);transition:transform .35s cubic-bezier(.2,.8,.2,1);display:flex;flex-direction:column;box-shadow:-20px 0 60px rgba(0,0,0,.5)}
body.drawer-open .drawer{transform:none}
body.drawer-open .backdrop{opacity:1;pointer-events:auto}
.d-head{display:flex;justify-content:space-between;align-items:center;padding:16px 18px 6px}
.d-head h3{font-size:16px}
.d-x{background:none;border:0;color:var(--dim);font-size:20px;cursor:pointer}.d-x:hover{color:var(--text)}
.tabs{display:flex;gap:4px;padding:6px 14px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.tab{background:none;border:1px solid transparent;border-radius:8px;color:var(--dim);padding:5px 11px;font-size:12px;cursor:pointer}
.tab:hover{color:var(--text)}
.tab.on{background:var(--panel);border-color:var(--c,var(--line));color:var(--c,var(--text))}
.d-body{padding:16px 18px 30px;overflow-y:auto;flex:1;scrollbar-width:thin;scrollbar-color:#2c335a transparent}
.d-body::-webkit-scrollbar{width:8px}.d-body::-webkit-scrollbar-thumb{background:#2c335a;border-radius:99px}
.d-intro{color:var(--dim);font-size:13px;margin-bottom:12px;line-height:1.55}
.d-intro b{color:var(--text)}
.d-label{font-size:10px;letter-spacing:2px;text-transform:uppercase;color:var(--dim);margin:16px 0 6px;display:flex;justify-content:space-between;align-items:center}
.copy{background:none;border:1px solid var(--line);color:var(--dim);border-radius:6px;font-size:10px;padding:2px 8px;cursor:pointer}.copy:hover{color:var(--text);border-color:var(--dim)}
pre.yaml{background:#0a0d19;border:1px solid var(--line);border-radius:12px;padding:12px 14px;font:12px/1.55 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;overflow-x:auto;white-space:pre;color:#c9d1f5;scrollbar-width:thin;scrollbar-color:#2c335a transparent}
.y-k{color:#7cc4ff}.y-c{color:#5d668f;font-style:italic}.y-s{color:#a5e8b4}.y-v{color:#ffc94d}
svg.diagram{width:100%;height:auto;display:block;background:#0a0d19;border:1px solid var(--line);border-radius:12px}
.dn rect{fill:#161b30;stroke:var(--line);stroke-width:1.5;transition:all .3s}
.dn text{fill:var(--text);font:600 12px system-ui;text-anchor:middle}
.dn .sm{font:400 10px system-ui;fill:var(--dim)}
.dn.on rect{stroke:var(--c);filter:drop-shadow(0 0 8px var(--c))}
.dn.referee{--c:var(--ref)}.dn.thinker{--c:var(--think)}.dn.guesser{--c:var(--guess)}
.de{fill:none;stroke:#3a4272;stroke-width:1.6;marker-end:url(#ah)}
.de.on{stroke:var(--ref);stroke-dasharray:6 5;animation:dash .6s linear infinite}
@keyframes dash{to{stroke-dashoffset:-11}}
.dl circle{fill:#0a0d19;stroke:#3a4272}.dl text{fill:var(--dim);font:700 10px system-ui;text-anchor:middle}
.legend{margin:12px 0 0;padding-left:0;list-style:none;font-size:12.5px;color:var(--dim);display:grid;gap:5px}
.legend b{display:inline-grid;place-items:center;width:18px;height:18px;border-radius:50%;border:1px solid #3a4272;color:var(--text);font-size:10px;margin-right:8px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>🎯 20 QUESTIONS</h1>
    <div class="sub">Two AI agents play. The Referee routes their messages (A2A). You watch.</div>
    <div class="controls">
      <label>Thinker model<select id="tm" autocomplete="off"></select></label>
      <label>Guesser model<select id="gm" autocomplete="off"></select></label>
      <button class="btn go" id="start">▶ Start game</button>
      <button class="btn stop hidden" id="stop">■ Stop</button>
    </div>
  </header>

  <div class="secret empty" id="secret"><small>Secret word</small><b id="secretWord">— not chosen yet —</b></div>

  <div class="flow">
    <div class="node t" id="nT">🧠 Thinker</div>
    <div class="wire" id="w1"><i></i></div>
    <div class="node r" id="nR">⚖️ Referee</div>
    <div class="wire" id="w2"><i></i></div>
    <div class="node g" id="nG">🔍 Guesser</div>
  </div>

  <div class="pips" id="pips"></div>

  <div class="arena">
    <div class="side thinker" id="sT">
      <div class="card">
        <div class="bot" id="botT"><div class="ant"></div><div class="dots">💭</div>
          <div class="head"><div class="eyes"><div class="eye"></div><div class="eye"></div></div><div class="mouth"></div></div><div class="body"></div></div>
        <div class="role">THINKER</div><div class="model" id="mT"></div><div class="status" id="stT">idle</div>
      </div>
    </div>

    <div>
      <div class="chat" id="chat"></div>
      <div class="banner hidden" id="banner"></div>
    </div>

    <div class="side guesser" id="sG">
      <div class="card">
        <div class="bot" id="botG"><div class="ant"></div><div class="dots">💭</div>
          <div class="head"><div class="eyes"><div class="eye"></div><div class="eye"></div></div><div class="mouth"></div></div><div class="body"></div></div>
        <div class="role">GUESSER</div><div class="model" id="mG"></div><div class="status" id="stG">idle</div>
      </div>
    </div>
  </div>
</div>
<button class="info-btn" id="infoBtn">📖 How it works</button>
<div class="backdrop" id="backdrop"></div>
<aside class="drawer" id="drawer" aria-label="How it works">
  <div class="d-head"><h3>🔧 How it works</h3><button class="d-x" id="dClose" aria-label="Close">✕</button></div>
  <div class="tabs" id="tabs"></div>
  <div class="d-body" id="dBody"></div>
</aside>
<div class="overlay" id="overlay"></div>

<script>
const $ = id => document.getElementById(id);
const chat = $('chat'), MAX = 20, HINT = '<div class="empty-hint">Pick two models and press <b>Start</b>.</div>';
let models = [], typingEl = null, status = 'idle';
chat.innerHTML = HINT;

const label = id => (models.find(m => m.id === id) || {label: id || ''}).label;
function fillSelects(list, tm, gm){
  models = list;
  for (const [el, val] of [[$('tm'), tm], [$('gm'), gm]]) {
    if (el.options.length !== list.length) el.innerHTML = list.map(m => `<option value="${m.id}">${m.label}</option>`).join('');
    if (val && !el.disabled) el.value = val;
  }
}
function buildPips(){ $('pips').innerHTML = Array.from({length: MAX}, (_, i) => `<div class="pip" id="p${i+1}">${i+1}</div>`).join(''); }
buildPips();

function setPlaying(p){
  $('start').classList.toggle('hidden', p);
  $('stop').classList.toggle('hidden', !p);
  $('tm').disabled = $('gm').disabled = p;
}

function setActive(agent){
  window.__agent = agent; diagram(agent);
  $('sT').classList.toggle('active', agent === 'thinker');
  $('sG').classList.toggle('active', agent === 'guesser');
  $('botT').classList.toggle('thinking', agent === 'thinker');
  $('botG').classList.toggle('thinking', agent === 'guesser');
  $('nT').classList.toggle('on', agent === 'thinker');
  $('nG').classList.toggle('on', agent === 'guesser');
  $('nR').classList.toggle('on', agent === 'referee');
  // packets: guesser->referee (leftward on w2), referee->thinker (leftward on w1)
  $('w1').className = 'wire' + (agent === 'referee' || agent === 'thinker' ? ' l' : '');
  $('w2').className = 'wire' + (agent === 'referee' ? ' l' : agent === 'guesser' ? ' r' : '');
  const idle = status === 'playing' ? 'waiting' : 'idle';
  $('stT').textContent = agent === 'thinker' ? 'thinking about answer…' : idle;
  $('stG').textContent = agent === 'guesser' ? 'forming a question…' : idle;
  if (agent === 'referee') { $('stT').textContent = 'receiving question…'; }
}

function talk(botId, ms){ const b = $(botId); b.classList.add('talking'); setTimeout(() => b.classList.remove('talking'), ms || 1200); }
function react(botId, cls){ const b = $(botId); b.classList.remove('nod','shake'); void b.offsetWidth; b.classList.add(cls); setTimeout(() => b.classList.remove(cls), 1100); }

function scroll(){ chat.scrollTop = chat.scrollHeight; }
function clearTyping(){ typingEl?.remove(); typingEl = null; }
function showTyping(kind){
  clearTyping();
  typingEl = document.createElement('div');
  typingEl.className = `msg typing ${kind}`;
  typingEl.innerHTML = `<small>${kind === 'q' ? 'Guesser' : 'Thinker'}</small><span></span><span></span><span></span>`;
  chat.appendChild(typingEl); scroll();
}
function clearHint(){ chat.querySelector('.empty-hint')?.remove(); }
function addQuestion(turn, text){
  clearTyping(); clearHint();
  const d = document.createElement('div'); d.className = 'msg q';
  const s = document.createElement('small'); s.textContent = `Guesser · Q${turn}`;
  d.append(s, text);
  chat.appendChild(d); scroll(); talk('botG');
}
function addAnswer(turn, ans, quiet, why){
  clearTyping(); clearHint();
  const d = document.createElement('div');
  d.className = 'msg a ' + (ans === 'CORRECT' ? 'correct' : ans === 'YES' ? 'yes' : '');
  d.innerHTML = `<small>Thinker · A${turn}</small><div class="ans">${ans === 'CORRECT' ? '🎉 CORRECT!' : ans}</div>`;
  if (why){ const w = document.createElement('div'); w.className = 'why'; w.textContent = '💭 ' + why; d.appendChild(w); }
  chat.appendChild(d); scroll();
  if (!quiet){ talk('botT', 700); react('botT', ans === 'NO' ? 'shake' : 'nod'); }
  const p = $('p' + turn);
  if (p){ p.classList.remove('now'); p.classList.add(ans === 'CORRECT' ? 'win' : ans === 'YES' ? 'yes' : 'no'); }
}

function resetUI(){
  chat.innerHTML = HINT; buildPips();
  $('banner').classList.add('hidden'); $('overlay').innerHTML = '';
  $('secret').classList.add('empty'); $('secretWord').textContent = '— not chosen yet —';
  for (const s of ['sT','sG']) $(s).classList.remove('win','lose');
  clearTyping(); status = 'idle'; setPlaying(false); setActive(null);
}

function showSecret(c){ $('secret').classList.remove('empty'); $('secretWord').textContent = `${c.emoji} ${c.word.toUpperCase()}  ·  ${c.category}`; }

function renderState(s){
  fillSelects(s.models || models, s.thinkerModel, s.guesserModel);
  $('mT').textContent = label(s.thinkerModel); $('mG').textContent = label(s.guesserModel);
  if (s.status === 'idle') return resetUI();
  chat.innerHTML = ''; buildPips(); $('banner').classList.add('hidden');
  for (const x of ['sT','sG']) $(x).classList.remove('win','lose');
  status = s.status;
  if (s.concept) showSecret(s.concept);
  for (const h of s.history){ addQuestion(h.turn, h.question); if (h.answer) addAnswer(h.turn, h.answer, true, h.why); }
  if (s.status === 'playing') {
    setPlaying(true);
    const last = s.history.at(-1);
    if (s.currentTurn && !(last && last.answer)) $('p' + s.currentTurn)?.classList.add('now');
    setActive(s.thinking);
    if (s.thinking === 'guesser') showTyping('q'); else if (s.thinking === 'thinker' && s.concept) showTyping('a');
    if (!s.history.length && !s.concept) chat.innerHTML = '<div class="empty-hint">The Thinker is choosing a secret…</div>';
  } else if (s.status === 'over') showOver(s);
}

function showOver(s){
  clearTyping(); setActive(null); setPlaying(false); status = 'over';
  if (s.concept) showSecret(s.concept);
  const b = $('banner'); b.classList.remove('hidden');
  const won = s.winner === 'guesser', err = s.winner === 'error';
  b.style.setProperty('--c', err ? 'var(--no)' : won ? 'var(--guess)' : 'var(--think)');
  const w = s.concept ? `${s.concept.emoji} ${s.concept.word}` : '';
  const n = s.history.length;
  b.innerHTML = err
    ? `<h2>⚠️ Game aborted</h2><p></p>`
    : won ? `<h2>🔍 Guesser wins!</h2><p>Found <b>${w}</b> in ${n} question${n > 1 ? 's' : ''}.</p>`
          : `<h2>🧠 Thinker wins!</h2><p>Nobody guessed <b>${w}</b> in 20 questions.</p>`;
  if (err) b.querySelector('p').textContent = s.reason || 'LLM error';
  const btn = document.createElement('button'); btn.className = 'btn go'; btn.textContent = '↻ Play again'; btn.onclick = startGame;
  b.appendChild(btn);
  if (!err){ $(won ? 'sG' : 'sT').classList.add('win'); $(won ? 'sT' : 'sG').classList.add('lose'); if (won) confetti(); }
  b.scrollIntoView({behavior: 'smooth', block: 'nearest'});
}

function confetti(){
  const cols = ['#ff5d6c','#ffc94d','#4da3ff','#3ddc97','#6cf0ff'];
  for (let i = 0; i < 70; i++){
    const c = document.createElement('div'); c.className = 'confetti';
    c.style.left = Math.random() * 100 + 'vw'; c.style.background = cols[i % 5];
    c.style.animationDuration = 2 + Math.random() * 2.5 + 's'; c.style.animationDelay = Math.random() * .6 + 's';
    document.body.appendChild(c); setTimeout(() => c.remove(), 5500);
  }
}

async function startGame(){
  resetUI(); status = 'playing'; setPlaying(true); setActive('thinker');
  chat.innerHTML = '<div class="empty-hint">The Thinker is choosing a secret…</div>';
  $('stT').textContent = 'choosing a secret…';
  await fetch('/start', {method: 'POST', headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({thinkerModel: $('tm').value, guesserModel: $('gm').value})});
}
async function stopGame(){ await fetch('/stop', {method: 'POST'}); }
$('start').onclick = startGame; $('stop').onclick = stopGame;

const es = new EventSource('/events');
const on = (n, f) => es.addEventListener(n, e => f(JSON.parse(e.data)));
on('sync', renderState);
on('reset', renderState);
on('concept', c => {
  showSecret(c);
  $('overlay').innerHTML = `<div class="pop"><div class="e">${c.emoji}</div><div class="t">Thinker chose a ${c.category}</div><div class="w">${c.word.toUpperCase()}</div></div>`;
  setTimeout(() => { $('overlay').innerHTML = ''; }, 3100);
  $('stT').textContent = 'secret chosen!'; talk('botT', 1500);
  chat.innerHTML = '<div class="empty-hint">Secret chosen — questions incoming…</div>';
});
on('thinking', d => {
  setActive(d.agent);
  if (d.turn) $('p' + d.turn)?.classList.add('now');
  if (d.agent === 'guesser') showTyping('q');
  else if (d.agent === 'thinker') showTyping('a');
  else clearTyping();
});
on('question', d => addQuestion(d.turn, d.question));
on('answer', d => { addAnswer(d.turn, d.answer, false, d.why); setActive(null); });
on('gameover', showOver);

// ── How-it-works drawer ──
const INTRO = {
  overview: `Three agents, one rule: <b>they only talk through the Referee</b>. The Guesser never sees the secret; the Thinker never sees the Guesser's history. Each turn is four A2A messages. Click a tab to see each agent's definition.`,
  referee: `<b>The orchestrator.</b> Picks the secret, shows it to you, then loops up to 20 turns: ask the Guesser, forward to the Thinker, relay the answer. It declares the winner. In this demo the Referee is plain Express code, so it costs no tokens.`,
  thinker: `<b>The keeper of the secret.</b> Gets one question at a time. It writes one short sentence of reasoning, then commits to YES or NO. That reasoning step stops reflex mistakes on ambiguous questions, and it's shown under each answer.`,
  guesser: `<b>The detective.</b> Sees only the Q&amp;A history. Starts broad, narrows down, and starts guessing specific candidates from about question 10. Told that answers can occasionally be wrong, so it re-tests surprising ones.`,
};
const TABS = [['overview','Overview',''],['referee','Referee','var(--ref)'],['thinker','Thinker','var(--think)'],['guesser','Guesser','var(--guess)'],['full','Full YAML','']];
let yamlText = '', rawYaml = '', curTab = 'overview';
// Reflect the model dropdowns in the YAML shown in the panel
function applyModels(){
  let t = rawYaml;
  for (const [llm, sel] of [['thinker_llm', $('tm')], ['guesser_llm', $('gm')]])
    if (sel.value) t = t.replace(new RegExp(`(^  ${llm}:[\\s\\S]*?^    model:\\s*)\\S+`, 'm'), `$1${sel.value}`);
  yamlText = t;
}
$('tm').addEventListener('change', () => { applyModels(); if (document.body.classList.contains('drawer-open')) renderTab(curTab); });
$('gm').addEventListener('change', () => { applyModels(); if (document.body.classList.contains('drawer-open')) renderTab(curTab); });

function esc(s){ return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function hl(src){
  let blockIndent = -1;
  return src.split('\n').map(line => {
    const ind = line.length - line.trimStart().length;
    if (blockIndent >= 0 && (line.trim() === '' || ind > blockIndent)) return `<span class="y-s">${esc(line)}</span>`;
    blockIndent = -1;
    if (/^\s*#/.test(line)) return `<span class="y-c">${esc(line)}</span>`;
    const m = line.match(/^(\s*(?:- )?)([\w.-]+)(:)(.*)$/);
    if (!m) return esc(line);
    if (/^\s*[|>]\s*$/.test(m[4])) blockIndent = ind;
    const v = m[4].trim();
    const val = !v ? '' : /^[|>]$/.test(v) ? ` <span class="y-v">${v}</span>` : ` <span class="y-v">${esc(v)}</span>`;
    return `${esc(m[1])}<span class="y-k">${m[2]}</span>:${val}`;
  }).join('\n');
}
function block(text, header, indent){
  const lines = text.split('\n'), out = []; let on = false;
  for (const l of lines){
    const m = l.match(/^(\s*)([\w.-]+):\s*$/);
    if (m && m[1].length === indent){ on = false; }
    if (new RegExp(`^ {${indent}}${header}:`).test(l)) on = true;
    if (on) out.push(l);
    if (on === false && out.length && /^\S/.test(l)) break;
  }
  return out.join('\n').trimEnd();
}
function yamlFor(tab){
  if (tab === 'full') return yamlText;
  const agent = block(yamlText.slice(yamlText.indexOf('\nagents:')), tab, 2);
  const mm = agent.match(/^\s+model:\s*(\S+)/m);
  const model = mm ? block(yamlText.slice(0, yamlText.indexOf('\nagents:')), mm[1], 2) : '';
  return { agent, model };
}
function diagramSvg(){
  return `<svg class="diagram" id="dia" viewBox="0 0 440 290" role="img" aria-label="Agent message flow">
  <defs><marker id="ah" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L8 4L0 8z" fill="#7d86b8"/></marker></defs>
  <path class="de" data-e="1" d="M270 86 L330 196"/>
  <path class="de" data-e="2" d="M398 196 Q 392 100 292 70"/>
  <path class="de" data-e="3" d="M170 86 L110 196"/>
  <path class="de" data-e="4" d="M42 196 Q 48 100 148 70"/>
  <g class="dl"><circle cx="305" cy="135" r="9"/><text x="305" y="139">1</text><circle cx="378" cy="120" r="9"/><text x="378" y="124">2</text>
  <circle cx="135" cy="135" r="9"/><text x="135" y="139">3</text><circle cx="62" cy="120" r="9"/><text x="62" y="124">4</text></g>
  <g class="dn referee" data-a="referee"><rect x="150" y="30" width="140" height="56" rx="12"/><text x="220" y="55">⚖️ Referee</text><text class="sm" x="220" y="72">orchestrator · A2A</text></g>
  <g class="dn thinker" data-a="thinker"><rect x="20" y="196" width="130" height="60" rx="12"/><text x="85" y="222">🧠 Thinker</text><text class="sm" x="85" y="240">knows the secret</text></g>
  <g class="dn guesser" data-a="guesser"><rect x="290" y="196" width="130" height="60" rx="12"/><text x="355" y="222">🔍 Guesser</text><text class="sm" x="355" y="240">asks yes/no</text></g>
  <text class="sm" x="220" y="278" style="fill:#5d668f;font:10px system-ui;text-anchor:middle">each agent → its own LLM via OpenRouter</text>
  </svg>
  <ul class="legend">
    <li><b>1</b>Referee asks the Guesser for the next question</li>
    <li><b>2</b>Guesser returns a yes/no question</li>
    <li><b>3</b>Referee forwards it to the Thinker (checks if it names the secret)</li>
    <li><b>4</b>Thinker answers YES or NO; Referee records it and loops</li>
  </ul>`;
}
function diagram(agent){
  const svg = document.getElementById('dia'); if (!svg) return;
  svg.querySelectorAll('.dn').forEach(n => n.classList.toggle('on', n.dataset.a === agent));
  const edges = { guesser: ['1'], referee: ['2','3'], thinker: ['4'] }[agent] || [];
  svg.querySelectorAll('.de').forEach(e => e.classList.toggle('on', edges.includes(e.dataset.e)));
}
function renderTab(tab){
  curTab = tab; applyModels();
  $('tabs').innerHTML = TABS.map(([k, l, c]) => `<button class="tab${k === tab ? ' on' : ''}" data-t="${k}" ${c ? `style="--c:${c}"` : ''}>${l}</button>`).join('');
  const b = $('dBody');
  if (tab === 'overview') {
    b.innerHTML = `<p class="d-intro">${INTRO.overview}</p>${diagramSvg()}`;
    diagram(window.__agent || null);
  } else if (tab === 'full') {
    b.innerHTML = `<p class="d-intro">The whole <b>game.yaml</b>, served live from the repo.</p><div class="d-label">game.yaml <button class="copy" data-copy="full">copy</button></div><pre class="yaml">${hl(yamlText)}</pre>`;
  } else {
    const y = yamlFor(tab);
    b.innerHTML = `<p class="d-intro">${INTRO[tab]}</p><div class="d-label">agents.${tab} <button class="copy" data-copy="agent">copy</button></div><pre class="yaml">${hl(y.agent)}</pre>` +
      (y.model ? `<div class="d-label">models <button class="copy" data-copy="model">copy</button></div><pre class="yaml">${hl(y.model)}</pre>` : '');
  }
  b.scrollTop = 0;
}
function openDrawer(){
  document.body.classList.add('drawer-open');
  renderTab(curTab);
  fetch('/api/yaml', {cache: 'no-store'}).then(r => { if (!r.ok) throw new Error('HTTP ' + r.status); return r.text(); })
    .then(t => { rawYaml = t; renderTab(curTab); })
    .catch(e => { if (!rawYaml) $('dBody').innerHTML = `<p class="d-intro">Couldn't load game.yaml (${esc(String(e.message))}). Reload the page and try again.</p>`; });
}
function closeDrawer(){ document.body.classList.remove('drawer-open'); }
$('infoBtn').onclick = openDrawer; $('dClose').onclick = closeDrawer; $('backdrop').onclick = closeDrawer;
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeDrawer(); });
$('tabs').addEventListener('click', e => { const t = e.target.closest('.tab'); if (t) renderTab(t.dataset.t); });
$('dBody').addEventListener('click', e => {
  const c = e.target.closest('.copy'); if (!c) return;
  const y = curTab === 'full' ? yamlText : yamlFor(curTab);
  navigator.clipboard?.writeText(typeof y === 'string' ? y : y[c.dataset.copy]);
  c.textContent = 'copied ✓'; setTimeout(() => c.textContent = 'copy', 1200);
});
</script>
</body>
