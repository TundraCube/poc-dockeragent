<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>20 Questions — AI Agents at Play</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0d1117;--surface:#161b22;--border:#30363d;
  --text:#c9d1d9;--dim:#8b949e;
  --thinker:#f85149;--thinker-bg:rgba(248,81,73,0.12);--thinker-glow:rgba(248,81,73,0.3);
  --ref:#d2991d;--ref-glow:rgba(210,153,29,0.3);
  --guesser:#58a6ff;--guesser-bg:rgba(88,166,255,0.12);--guesser-glow:rgba(88,166,255,0.3);
}
body{
  background:var(--bg);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;
  display:flex;justify-content:center;min-height:100vh;
}
.container{max-width:680px;width:100%;padding:24px 20px 40px}

/* Header */
h1{font-size:1.5rem;font-weight:600;text-align:center;margin-bottom:4px}
.sub{font-size:.78rem;color:var(--dim);text-align:center;margin-bottom:16px}

/* ── Agent cards ── */
.agents{display:flex;gap:10px;margin-bottom:14px;justify-content:center;flex-wrap:wrap}
.agent-card{
  background:var(--surface);border:1px solid var(--border);
  border-radius:10px;padding:12px 14px;min-width:130px;text-align:center;
  transition:border-color .2s,box-shadow .2s;
}
.agent-card .avatar{font-size:1.6rem;margin-bottom:2px}
.agent-card .name{font-weight:600;font-size:.82rem}
.agent-card .role{font-size:.68rem;color:var(--dim);margin-top:1px}
.agent-card .status{font-size:.7rem;margin-top:4px;min-height:17px}
.agent-card .dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:4px;vertical-align:middle}
.agent-card .dot.pulse{animation:pulse .8s ease-in-out infinite}
.agent-card.thinker{border-color:var(--thinker);box-shadow:0 0 0 transparent}.agent-card.thinker.active{box-shadow:0 0 12px var(--thinker-glow)}
.agent-card.thinker .name{color:var(--thinker)}.agent-card.thinker .dot{background:var(--thinker)}
.agent-card.referee.active{box-shadow:0 0 12px var(--ref-glow)}
.agent-card.referee .name{color:var(--ref)}.agent-card.referee .dot{background:var(--ref)}
.agent-card.guesser{border-color:var(--guesser);box-shadow:0 0 0 transparent}.agent-card.guesser.active{box-shadow:0 0 12px var(--guesser-glow)}
.agent-card.guesser .name{color:var(--guesser)}.agent-card.guesser .dot{background:var(--guesser)}
@keyframes pulse{0%,100%{opacity:.3;transform:scale(.8)}50%{opacity:1;transform:scale(1.2)}}

/* ── Model selectors ── */
.models{display:flex;gap:10px;margin-bottom:12px;justify-content:center;flex-wrap:wrap}
.model-group{display:flex;flex-direction:column;gap:4px;align-items:center}
.model-group label{font-size:.72rem;color:var(--dim);text-transform:uppercase;letter-spacing:.05em}
.model-group select{
  background:var(--surface);color:var(--text);border:1px solid var(--border);
  border-radius:6px;padding:5px 10px;font-size:.78rem;cursor:pointer;
  outline:none;min-width:200px;
}
.model-group select:focus{border-color:var(--ref)}

/* ── Buttons ── */
.buttons{display:flex;gap:8px;margin-bottom:14px;justify-content:center}
.btn{
  padding:8px 20px;font-size:.82rem;font-weight:500;
  border:1px solid var(--border);border-radius:6px;
  background:var(--surface);color:var(--text);cursor:pointer;transition:all .15s;
}
.btn:hover{background:#1c2129;border-color:#484f58}
.btn.hidden{display:none}
.btn:disabled{opacity:.5;cursor:not-allowed}

/* ── Question counter ── */
.counter{text-align:center;font-size:.82rem;color:var(--dim);margin-bottom:10px;min-height:22px}

/* ── Dialogue area ── */
.dialogue{
  border:1px solid var(--border);border-radius:10px;
  background:var(--surface);padding:16px;min-height:240px;max-height:420px;
  overflow-y:auto;margin-bottom:14px;
  scroll-behavior:smooth;
}
.dialogue .empty{color:var(--dim);text-align:center;padding:60px 0;font-size:.85rem}

/* ── Chat bubbles ── */
.bubble{
  display:flex;gap:10px;margin-bottom:14px;
  animation:slideIn .3s ease-out;
  animation-fill-mode:both;
}
.bubble:nth-child(2){animation-delay:.2s}
.bubble .avatar-bubble{font-size:1.3rem;min-width:28px;text-align:center}
.bubble .body{max-width:85%}
.bubble .header{font-size:.7rem;font-weight:600;margin-bottom:3px;text-transform:uppercase;letter-spacing:.04em}
.bubble .msg{
  padding:10px 14px;border-radius:12px;font-size:.88rem;line-height:1.45;
  word-break:break-word;
}
.bubble.guesser{justify-content:flex-start}
.bubble.guesser .msg{background:var(--guesser-bg);border-bottom-left-radius:4px}
.bubble.guesser .header{color:var(--guesser)}
.bubble.thinker{justify-content:flex-end}
.bubble.thinker .msg{background:var(--thinker-bg);border-bottom-right-radius:4px}
.bubble.thinker .header{color:var(--thinker);text-align:right}
.bubble.referee{justify-content:center}
.bubble.referee .msg{background:rgba(210,153,29,0.1);font-size:.78rem;text-align:center;font-style:italic}
.bubble.referee .header{color:var(--ref);text-align:center}
@keyframes slideIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}

/* ── Concept overlay ── */
.overlay{
  display:none;position:fixed;inset:0;background:rgba(0,0,0,0.7);
  z-index:1000;justify-content:center;align-items:center;
}
.overlay.show{display:flex}
.overlay .card{
  background:var(--surface);border:1px solid var(--border);
  border-radius:14px;width:280px;padding:28px 24px;text-align:center;
  transform:scale(0.5);transition:transform .4s ease-out;
  box-shadow:0 8px 32px rgba(0,0,0,0.5);
}
.overlay.show .card{transform:scale(1)}
.overlay .card .big-emoji{font-size:64px;margin-bottom:12px}
.overlay .card .title{font-size:.85rem;color:var(--dim);margin-bottom:6px}
.overlay .card .cat-name{font-size:1.15rem;font-weight:600;margin-bottom:4px}
.overlay .card .hint{font-size:.75rem;color:var(--dim);font-style:italic}
.overlay .card .reveal-word{font-size:1.4rem;font-weight:700;margin-top:8px}
.overlay .card .reveal-emoji{font-size:72px;margin-bottom:4px}

/* ── Game-over banner ── */
.gameover{display:none;text-align:center;margin-top:10px}
.gameover.show{display:block}
.gameover .winner-banner{
  padding:14px;border-radius:10px;font-size:1.15rem;font-weight:700;margin-bottom:14px;
}
.gameover .winner-banner.guesser{
  background:linear-gradient(135deg,var(--guesser-bg),rgba(88,166,255,0.25));
  color:var(--guesser);border:1px solid rgba(88,166,255,0.3);
}
.gameover .winner-banner.thinker{
  background:linear-gradient(135deg,var(--thinker-bg),rgba(248,81,73,0.25));
  color:var(--thinker);border:1px solid rgba(248,81,73,0.3);
}
.gameover .winner-banner.error{
  background:linear-gradient(135deg,rgba(248,81,73,0.125),rgba(210,153,29,0.125));
  color:var(--ref);border:1px solid rgba(210,153,29,0.3);
}
.gameover .reveal{text-align:center;margin-bottom:16px}
.gameover .reveal .big-emoji{font-size:72px}
.gameover .reveal .word{font-size:1.5rem;font-weight:700;margin:4px 0}
.gameover .reveal .score{font-size:.82rem;color:var(--dim)}
</style>
</head>
<body>
<div class="container">
  <h1>🎯 20 Questions</h1>
  <p class="sub">Two AI agents play — watch the dialogue unfold</p>

  <div class="agents">
    <div class="agent-card thinker" id="card-thinker">
      <div class="avatar">🧠</div>
      <div class="name">Thinker</div>
      <div class="role">Picks a secret concept</div>
      <div class="status"><span class="dot"></span> <span class="txt">idle</span></div>
    </div>
    <div class="agent-card referee" id="card-referee">
      <div class="avatar">⚖️</div>
      <div class="name">Referee</div>
      <div class="role">Orchestrates the game</div>
      <div class="status"><span class="dot"></span> <span class="txt">idle</span></div>
    </div>
    <div class="agent-card guesser" id="card-guesser">
      <div class="avatar">🔍</div>
      <div class="name">Guesser</div>
      <div class="role">Asks yes/no questions</div>
      <div class="status"><span class="dot"></span> <span class="txt">idle</span></div>
    </div>
  </div>

  <div class="models">
    <div class="model-group">
      <label>🧠 Thinker Model</label>
      <select id="thinker-model">
        <option value="anthropic/claude-haiku-4.5">Claude Haiku 4.5 (Anthropic)</option>
        <option value="anthropic/claude-sonnet-4.5">Claude Sonnet 4.5 (Anthropic)</option>
        <option value="openai/gpt-4o-mini">GPT-4o Mini (OpenAI)</option>
        <option value="openai/gpt-4o">GPT-4o (OpenAI)</option>
        <option value="google/gemini-flash-2.0">Gemini Flash 2.0 (Google)</option>
      </select>
    </div>
    <div class="model-group">
      <label>🔍 Guesser Model</label>
      <select id="guesser-model">
        <option value="openai/gpt-4o-mini" selected>GPT-4o Mini (OpenAI)</option>
        <option value="openai/gpt-4o">GPT-4o (OpenAI)</option>
        <option value="anthropic/claude-haiku-4.5">Claude Haiku 4.5 (Anthropic)</option>
        <option value="anthropic/claude-sonnet-4.5">Claude Sonnet 4.5 (Anthropic)</option>
        <option value="google/gemini-flash-2.0">Gemini Flash 2.0 (Google)</option>
      </select>
    </div>
  </div>

  <div class="buttons">
    <button class="btn" id="btn-start" onclick="startGame()">▶ Start Game</button>
    <button class="btn hidden" id="btn-reset" onclick="resetGame()">🔄 Play Again</button>
  </div>

  <div class="counter" id="counter"></div>

  <div class="dialogue" id="dialogue">
    <div class="empty" id="dialogue-empty">Select models and click Start to watch two AIs play 20 Questions.</div>
  </div>

  <div class="gameover" id="gameover">
    <div class="winner-banner" id="winner-banner"></div>
    <div class="reveal">
      <div class="big-emoji" id="reveal-emoji"></div>
      <div class="word" id="reveal-word"></div>
      <div class="score" id="reveal-score"></div>
    </div>
    <button class="btn" onclick="resetGame()">🔄 Play Again</button>
  </div>
</div>

<!-- Concept overlay -->
<div class="overlay" id="overlay">
  <div class="card" id="overlay-card">
    <div class="big-emoji" id="overlay-emoji"></div>
    <div class="title">The Thinker has chosen...</div>
    <div class="cat-name" id="overlay-cat"></div>
    <div class="hint" id="overlay-hint"></div>
    <div class="reveal-word" id="overlay-word" style="display:none"></div>
  </div>
</div>

<script>
(function(){
  const dialogue = document.getElementById('dialogue');
  const dEmpty = document.getElementById('dialogue-empty');
  const counter = document.getElementById('counter');
  const gameover = document.getElementById('gameover');
  const winnerBanner = document.getElementById('winner-banner');
  const revealEmoji = document.getElementById('reveal-emoji');
  const revealWord = document.getElementById('reveal-word');
  const revealScore = document.getElementById('reveal-score');
  const overlay = document.getElementById('overlay');
  const overlayEmoji = document.getElementById('overlay-emoji');
  const overlayCat = document.getElementById('overlay-cat');
  const overlayHint = document.getElementById('overlay-hint');
  const overlayWord = document.getElementById('overlay-word');
  const btnStart = document.getElementById('btn-start');
  const btnReset = document.getElementById('btn-reset');
  const thinkerModel = document.getElementById('thinker-model');
  const guesserModel = document.getElementById('guesser-model');

  const cardThinker = document.getElementById('card-thinker');
  const cardReferee = document.getElementById('card-referee');
  const cardGuesser = document.getElementById('card-guesser');

  let overlayTimer = null;

  function clearAgents() {
    [cardThinker, cardReferee, cardGuesser].forEach(c => {
      c.classList.remove('active');
      const dot = c.querySelector('.dot');
      if (dot) dot.classList.remove('pulse');
      const txt = c.querySelector('.txt');
      if (txt) txt.textContent = 'idle';
    });
  }

  function setAgent(agent, text) {
    clearAgents();
    if (!agent) return;
    const map = { thinker: cardThinker, referee: cardReferee, guesser: cardGuesser };
    const card = map[agent];
    if (!card) return;
    card.classList.add('active');
    const dot = card.querySelector('.dot');
    if (dot) dot.classList.add('pulse');
    const txt = card.querySelector('.txt');
    if (txt) txt.textContent = text || 'thinking...';
  }

  function addBubble(agent, text, turn) {
    dEmpty.style.display = 'none';
    const div = document.createElement('div');
    div.className = 'bubble ' + agent;

    let avatar = '⚖️';
    let name = 'Referee';
    if (agent === 'thinker') { avatar = '🧠'; name = 'Thinker'; }
    else if (agent === 'guesser') { avatar = '🔍'; name = 'Guesser'; }

    let label = name;
    if (agent === 'guesser' && turn) label = `${name} — Q${turn}`;
    if (agent === 'thinker' && turn) label = `${name} — Q${turn}`;

    div.innerHTML =
      `<div class="avatar-bubble">${avatar}</div>` +
      `<div class="body"><div class="header">${label}</div><div class="msg">${escapeHtml(text)}</div></div>`;
    dialogue.appendChild(div);
    dialogue.scrollTop = dialogue.scrollHeight;
  }

  function addRefereeMsg(text) {
    dEmpty.style.display = 'none';
    const div = document.createElement('div');
    div.className = 'bubble referee';
    div.innerHTML = `<div class="body" style="max-width:100%"><div class="msg">${escapeHtml(text)}</div></div>`;
    dialogue.appendChild(div);
    dialogue.scrollTop = dialogue.scrollHeight;
  }

  function escapeHtml(s) {
    const d = document.createElement('div');
    d.textContent = s;
    return d.innerHTML;
  }

  function showOverlay(category, emoji, word) {
    if (overlayTimer) clearTimeout(overlayTimer);
    overlayEmoji.textContent = emoji || '';
    overlayCat.textContent = category || '';
    overlayHint.textContent = word ? '' : `A mysterious ${(category||'').toLowerCase()}...`;
    overlayWord.textContent = word || '';
    overlayWord.style.display = word ? 'block' : 'none';

    if (word) {
      // Game-over reveal — also show word
      document.querySelector('#overlay .title').textContent = 'The secret concept was...';
    } else {
      document.querySelector('#overlay .title').textContent = 'The Thinker has chosen...';
    }

    overlay.classList.add('show');
    if (!word) {
      // Auto-dismiss after 2.5s for concept popup
      overlayTimer = setTimeout(() => overlay.classList.remove('show'), 2500);
    }
    // Game-over overlay stays until user clicks Play Again
  }

  function hideOverlay() {
    overlay.classList.remove('show');
    if (overlayTimer) clearTimeout(overlayTimer);
  }

  function showGameOver(winner, concept, score) {
    gameover.classList.add('show');
    winnerBanner.className = 'winner-banner ' + winner;
    revealEmoji.textContent = concept?.emoji || '';
    revealWord.textContent = concept?.word || '';
    revealScore.textContent = score || '';

    if (winner === 'guesser') {
      winnerBanner.textContent = `🏆 The Guesser wins! Solved in ${score}!`;
      document.querySelector('#overlay .title').textContent = 'The secret concept was...';
    } else if (winner === 'thinker') {
      winnerBanner.textContent = '🧠 The Thinker wins! Concept never guessed!';
      document.querySelector('#overlay .title').textContent = 'The secret concept was...';
    } else {
      winnerBanner.textContent = '⚠️ Game error — try again';
    }

    btnStart.classList.add('hidden');
    btnReset.classList.remove('hidden');
    counter.textContent = '';

    if (concept) {
      showOverlay(concept.category, concept.emoji, concept.word);
    }
  }

  function resetUI() {
    dialogue.innerHTML = '';
    const empty = document.createElement('div');
    empty.className = 'empty';
    empty.id = 'dialogue-empty';
    empty.textContent = 'Select models and click Start to watch two AIs play 20 Questions.';
    dialogue.appendChild(empty);
    counter.textContent = '';
    gameover.classList.remove('show');
    clearAgents();
    hideOverlay();
    btnStart.classList.remove('hidden');
    btnReset.classList.add('hidden');
  }

  // ── SSE ──
  const es = new EventSource('/events');

  es.addEventListener('sync', e => {
    const d = JSON.parse(e.data);
    if (d.status === 'idle') { resetUI(); return; }
    if (d.concept?.category && !d.winner) {
      showOverlay(d.concept.category, d.concept.emoji);
    }
    thinkerModel.value = d.thinkerModel || 'anthropic/claude-haiku-4.5';
    guesserModel.value = d.guesserModel || 'openai/gpt-4o-mini';
  });

  es.addEventListener('thinking', e => {
    const d = JSON.parse(e.data);
    setAgent(d.agent || d.thinking, 'thinking...');
  });

  es.addEventListener('concept', e => {
    const d = JSON.parse(e.data);
    showOverlay(d.category, d.emoji);
    addRefereeMsg(`The Thinker has chosen a concept from the <strong>${d.category}</strong> category. Let the questions begin!`);
  });

  es.addEventListener('question', e => {
    const d = JSON.parse(e.data);
    addBubble('guesser', d.question, d.turn);
    counter.textContent = `${d.turn}/20`;
    setAgent('thinker', 'thinking...');
  });

  es.addEventListener('answer', e => {
    const d = JSON.parse(e.data);
    const ansClass = d.answer === 'CORRECT' ? 'correct' : d.answer === 'YES' ? 'yes' : 'no';
    addBubble('thinker', d.answer, d.turn);
    setAgent(null);
  });

  es.addEventListener('gameover', e => {
    const d = JSON.parse(e.data);
    clearAgents();
    const score = d.winner === 'guesser' ? `${d.currentTurn}/20 questions` : '20/20 questions';
    showGameOver(d.winner, d.concept, score);
  });

  es.addEventListener('reset', e => {
    resetUI();
  });

  es.onerror = () => {
    console.warn('SSE disconnected, polling...');
    setInterval(() => {
      fetch('/state').then(r => r.json()).then(d => {
        if (d && d.status === 'playing') {
          // SSE reconnects automatically; poll doesn't need to reconstruct state
        }
      }).catch(() => {});
    }, 2000);
  };

  // ── Actions ──
  window.startGame = () => {
    hideOverlay();
    dialogue.innerHTML = '';
    const empty = document.createElement('div');
    empty.className = 'empty';
    empty.id = 'dialogue-empty';
    empty.style.display = 'none';
    dialogue.appendChild(empty);
    counter.textContent = '';
    gameover.classList.remove('show');
    btnStart.classList.add('hidden');
    btnReset.classList.add('hidden');
    clearAgents();

    setAgent('referee', 'orchestrating...');
    addRefereeMsg('Game starting... the Thinker is picking a secret concept.');

    fetch('/start', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        thinkerModel: thinkerModel.value,
        guesserModel: guesserModel.value,
      }),
    }).then(r => r.json()).catch(() => {});
  };

  window.resetGame = () => {
    hideOverlay();
    dialogue.innerHTML = '';
    const empty = document.createElement('div');
    empty.className = 'empty';
    empty.id = 'dialogue-empty';
    empty.style.display = 'none';
    dialogue.appendChild(empty);
    counter.textContent = '';
    gameover.classList.remove('show');
    btnStart.classList.add('hidden');
    btnReset.classList.add('hidden');
    clearAgents();

    setAgent('referee', 'orchestrating...');
    addRefereeMsg('New game starting... the Thinker is picking a secret concept.');

    fetch('/reset', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        thinkerModel: thinkerModel.value,
        guesserModel: guesserModel.value,
      }),
    }).then(r => r.json()).catch(() => {});
  };
})();
</script>
</body>
</html>
