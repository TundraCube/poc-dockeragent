<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tic-Tac-Toe - AI vs AI</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg: #0d1117;
  --surface: #161b22;
  --border: #30363d;
  --x-color: #58a6ff;
  --o-color: #3fb950;
  --text: #c9d1d9;
  --text-secondary: #8b949e;
  --glow-x: rgba(88,166,255,0.3);
  --glow-o: rgba(63,185,80,0.3);
  --win-glow: rgba(255,215,0,0.4);
}

body {
  background: var(--bg);
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: 100vh;
  -webkit-font-smoothing: antialiased;
}

.container {
  text-align: center;
  max-width: 420px;
  width: 100%;
  padding: 24px;
}

h1 {
  font-size: 1.5rem;
  font-weight: 600;
  letter-spacing: -0.01em;
  margin-bottom: 4px;
}

.subtitle {
  font-size: 0.8rem;
  color: var(--text-secondary);
  margin-bottom: 28px;
}

.status-bar {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  margin-bottom: 24px;
  height: 32px;
}

.player-badge {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-size: 0.9rem;
  font-weight: 500;
  padding: 4px 12px;
  border-radius: 6px;
  background: var(--surface);
  border: 1px solid var(--border);
}

.player-badge.x { color: var(--x-color); }
.player-badge.o { color: var(--o-color); }

.thinking-dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  animation: pulse 0.8s ease-in-out infinite;
  display: none;
}
.thinking-dot.active { display: block; }
.thinking-dot.x-dot { background: var(--x-color); box-shadow: 0 0 6px var(--glow-x); }
.thinking-dot.o-dot { background: var(--o-color); box-shadow: 0 0 6px var(--glow-o); }

@keyframes pulse {
  0%, 100% { opacity: 0.3; transform: scale(0..8); }
  50% { opacity: 1; transform: scale(1.2); }
}

.board {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 6px;
  background: var(--border);
  border-radius: 10px;
  padding: 6px;
  width: 100%;
  aspect-ratio: 1;
  max-width: 340px;
  margin: 0 auto 24px;
}

.cell {
  background: var(--surface);
  border-radius: 6px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 2.4rem;
  font-weight: 700;
  cursor: default;
  transition: background 0.15s;
}

.cell.x-mark { color: var(--x-color); }
.cell.o-mark { color: var(--o-color); }

.cell.last-move {
  box-shadow: inset 0 0 0 2px var(--text-secondary);
}

.cell.win-cell {
  animation: winPulse 0.6s ease-in-out infinite alternate;
}

@keyframes winPulse {
  from { box-shadow: inset 0 0 8px 2px var(--win-glow); }
  to   { box-shadow: inset 0 0 18px 4px var(--win-glow); }
}

.result {
  font-size: 1.1rem;
  font-weight: 600;
  margin-bottom: 16px;
  min-height: 28px;
}
.result.hidden { visibility: hidden; }
.result.x-win { color: var(--x-color); }
.result.o-win { color: var(--o-color); }
.result.draw { color: var(--text-secondary); }

.btn {
  display: inline-block;
  padding: 8px 20px;
  font-size: 0.85rem;
  font-weight: 500;
  border: 1px solid var(--border);
  border-radius: 6px;
  background: var(--surface);
  color: var(--text);
  cursor: pointer;
  transition: background 0.15s, border-color 0.15s;
}
.btn:hover { background: #1c2129; border-color: #484f58; }
.btn.hidden { display: none; }

.moves {
  margin-top: 20px;
  text-align: left;
  font-size: 0.75rem;
  color: var(--text-secondary);
  max-height: 120px;
  overflow-y: auto;
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 8px 12px;
  background: var(--surface);
  display: none;
}
.moves.has-moves { display: block; }
.moves div { padding: 2px 0; }
.moves .move-x { color: var(--x-color); }
.moves .move-o { color: var(--o-color); }
</style>
</head>
